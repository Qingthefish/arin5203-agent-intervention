[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-memory-crash-test"
version = "0.1.1"
description = "Crash-test the evidence an AI agent retains before state-changing actions."
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
  {name = "Qingcheng Yu"},
  {name = "Siu Kwun Yeung"},
  {name = "Qingyin Guo"}
]
keywords = [
  "ai-agents",
  "agent-memory",
  "context-compaction",
  "evaluation",
  "human-in-the-loop"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Qingthefish/agent-memory-crash-test"
Repository = "https://github.com/Qingthefish/agent-memory-crash-test"
Issues = "https://github.com/Qingthefish/agent-memory-crash-test/issues"
Research = "https://github.com/Qingthefish/arin5203-agent-intervention"

[project.scripts]
agent-memory-crash-test = "agent_memory_crash_test.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_memory_crash_test = ["py.typed"]
